<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video & Audio Toolbox (Groq SRT)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FFmpeg WASM & Util -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-2xl bg-gray-800 rounded-2xl shadow-2xl p-6 border border-gray-700">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-400">🎬 Video & Audio Toolbox</h1>
            <p class="text-sm text-gray-400 mt-1">Groq Whisper API (SRT) & Browser FFmpeg Compressor</p>
        </header>

        <!-- Settings Section -->
        <div class="mb-6 bg-gray-900 p-4 rounded-xl border border-gray-700">
            <label class="block text-sm font-medium text-gray-300 mb-2">🔑 Groq API Key:</label>
            <input type="password" id="apiKey" placeholder="gsk_..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>

        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-700 mb-6">
            <button id="tabSrtBtn" onclick="switchTab('srt')" class="flex-1 py-2 text-center font-medium border-b-2 border-indigo-500 text-indigo-400 transition">📝 SRT Generator</button>
            <button id="tabCompBtn" onclick="switchTab('comp')" class="flex-1 py-2 text-center font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition">📉 Video Compressor</button>
        </div>

        <!-- TAB 1: SRT GENERATOR -->
        <div id="srtTab" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Audio/Video ဖိုင်တင်ရန် (.mp3, .mp4, .wav, .m4a)</label>
                <input type="file" id="mediaFile" accept="audio/*,video/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            </div>
            <button onclick="generateSrt()" id="srtBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg">🚀 SRT ဖိုင် စတင်ထုတ်မည်</button>
            <div id="srtStatus" class="text-sm text-center text-gray-400"></div>
            <div id="srtResult" class="hidden">
                <a id="downloadSrtLink" class="block text-center bg-green-600 hover:bg-green-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg">📥 Download SRT File</a>
            </div>
        </div>

        <!-- TAB 2: VIDEO COMPRESSOR -->
        <div id="compTab" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">ဗီဒီယိုဖိုင်တင်ရန် (.mp4, .mov, .webm)</label>
                <input type="file" id="compFile" accept="video/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Compression အရည်အသွေး (CRF: 20-35): <span id="crfVal">28</span></label>
                <input type="range" id="crfRange" min="20" max="35" value="28" oninput="document.getElementById('crfVal').innerText = this.value" class="w-full accent-indigo-500">
            </div>
            <button onclick="compressVideo()" id="compBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg">📉 ဖိုင်ဆိုဒ် စတင်ချုံ့မည်</button>
            <div id="compStatus" class="text-sm text-center text-gray-400"></div>
            <div id="compResult" class="hidden">
                <a id="downloadCompLink" class="block text-center bg-green-600 hover:bg-green-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg">📥 Download Compressed Video</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            if(tab === 'srt') {
                document.getElementById('srtTab').classList.remove('hidden');
                document.getElementById('compTab').classList.add('hidden');
                document.getElementById('tabSrtBtn').className = "flex-1 py-2 text-center font-medium border-b-2 border-indigo-500 text-indigo-400 transition";
                document.getElementById('tabCompBtn').className = "flex-1 py-2 text-center font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition";
            } else {
                document.getElementById('compTab').classList.remove('hidden');
                document.getElementById('srtTab').classList.add('hidden');
                document.getElementById('tabCompBtn').className = "flex-1 py-2 text-center font-medium border-b-2 border-indigo-500 text-indigo-400 transition";
                document.getElementById('tabSrtBtn').className = "flex-1 py-2 text-center font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition";
            }
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            const milliseconds = Math.floor((seconds - Math.floor(seconds)) * 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')},${String(milliseconds).padStart(3, '0')}`;
        }

        async function generateSrt() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const fileInput = document.getElementById('mediaFile');
            const statusDiv = document.getElementById('srtStatus');
            const resultDiv = document.getElementById('srtResult');

            if (!apiKey) {
                alert('ကျေးဇူးပြု၍ Groq API Key ထည့်ပါ။');
                return;
            }
            if (fileInput.files.length === 0) {
                alert('ကျေးဇူးပြု၍ ဖိုင်တစ်ခု ရွေးပါ။');
                return;
            }

            const file = fileInput.files[0];
            statusDiv.innerText = '🔄 Groq API သို့ ပေးပို့နေပါပြီ...';
            resultDiv.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('model', 'whisper-large-v3-turbo');
            formData.append('response_format', 'verbose_json');
            formData.append('timestamp_granularities[]', 'segment');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const data = await response.json();
                let srtContent = '';

                if (data.segments) {
                    data.segments.forEach((seg, index) => {
                        const start = formatTime(seg.start);
                        const end = formatTime(seg.end);
                        const text = seg.text.trim();
                        srtContent += `${index + 1}\n${start} --> ${end}\n${text}\n\n`;
                    });
                }

                const blob = new Blob([srtContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const downloadLink = document.getElementById('downloadSrtLink');
                downloadLink.href = url;
                downloadLink.download = 'output.srt';

                statusDiv.innerText = '✅ SRT ဖိုင် အောင်မြင်စွာ ထွက်လာပါပြီ!';
                resultDiv.classList.remove('hidden');
            } catch (err) {
                statusDiv.innerText = `❌ Error ဖြစ်ပေါ်သည်: ${err.message}`;
            }
        }

        let ffmpegInstance = null;
        async function compressVideo() {
            const fileInput = document.getElementById('compFile');
            const statusDiv = document.getElementById('compStatus');
            const resultDiv = document.getElementById('compResult');
            const crf = document.getElementById('crfRange').value;

            if (fileInput.files.length === 0) {
                alert('ကျေးဇူးပြု၍ ဗီဒီယိုဖိုင် ရွေးပါ။');
                return;
            }

            const file = fileInput.files[0];
            statusDiv.innerText = '⏳ FFmpeg ကို စတင်ဖွင့်နေပါပြီ (ခဏစောင့်ပါ)...';
            resultDiv.classList.add('hidden');

            try {
                if (!ffmpegInstance) {
                    const { FFmpeg } = FFmpegWASM;
                    ffmpegInstance = new FFmpeg();
                    
                    const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                    await ffmpegInstance.load({
                        coreURL: `${baseURL}/ffmpeg-core.js`,
                        wasmURL: `${baseURL}/ffmpeg-core.wasm`,
                    });
                }

                statusDiv.innerText = '📉 ဗီဒီယိုဖိုင်ဆိုဒ် ချုံ့နေပါပြီ...';

                const inputName = 'input.mp4';
                const outputName = 'output_compressed.mp4';

                await ffmpegInstance.writeFile(inputName, await FFmpegWASM.fetchFile(file));
                await ffmpegInstance.exec(['-i', inputName, '-vcodec', 'libx264', '-crf', crf, outputName]);

                const data = await ffmpegInstance.readFile(outputName);
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                const downloadLink = document.getElementById('downloadCompLink');
                downloadLink.href = url;
                downloadLink.download = 'compressed_video.mp4';

                statusDiv.innerText = '✅ ဖိုင်ဆိုဒ်ချုံ့ခြင်း ပြီးစီးပါပြီ!';
                resultDiv.classList.remove('hidden');
            } catch (err) {
                statusDiv.innerText = `❌ Error ဖြစ်ပေါ်သည်: ${err.message}`;
            }
        }
    </script>
</body>
</html>
